<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2972 Team Portal Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: demo bar on top, shared left rail (tiles by mode and role, bell, mode switch, account), each app's own top bar and screens on the right, side drawers for detail. Team 2972 navy and gold. */
:root {
  --bg: #f6f3ea; --surface: #ffffff; --surface-2: #ece7da; --surface-3: #e2dccb; --line: rgba(11,18,36,.12); --line-2: rgba(11,18,36,.24);
  --text: #0b1224; --text-2: #323b50; --mute: #5a6378;
  --gold: #e8b931; --gold-2: #ffd666; --on-gold: #07090f; --accent: #7a5800; --tint: rgba(176,125,0,.10); --tint-2: rgba(176,125,0,.18);
  --ok: #1d7446; --ok-bg: rgba(29,116,70,.12); --warn: #8f5a00; --warn-bg: rgba(200,130,0,.14); --bad: #b42318; --bad-bg: rgba(180,35,24,.10); --info: #2353b0; --info-bg: rgba(35,83,176,.10);
  --rail: #0b1224; --rail-2: #141c33; --rail-text: #e9ecf3; --rail-mute: #8f98ad;
  --role-pit: #e8b931; --role-scout: #4f7fd9; --role-drive: #2e9e6a; --role-break: #a7adbb; --role-lead: #9b6ad6; --role-media: #d9774f;
  --heat-0: #ece7da; --heat-1: #f3dc94; --heat-2: #e8b931; --heat-3: #b8860b;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #07090f; --surface: #121a2b; --surface-2: #0d1220; --surface-3: #1b2439; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.18);
  --text: #e9ecf3; --text-2: #c2c8d6; --mute: #8f98ad; --accent: #e8b931; --tint: rgba(232,185,49,.10); --tint-2: rgba(232,185,49,.18);
  --ok: #4cc38a; --ok-bg: rgba(76,195,138,.13); --warn: #f0b43c; --warn-bg: rgba(240,180,60,.13); --bad: #f2716a; --bad-bg: rgba(242,113,106,.13); --info: #86acff; --info-bg: rgba(134,172,255,.13);
  --rail: #0b101d; --rail-2: #151d31; --role-break: #59607a; --heat-0: #1b2439; --heat-1: #5c4a17; --heat-2: #a8841f; --heat-3: #e8b931; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #07090f; --surface: #121a2b; --surface-2: #0d1220; --surface-3: #1b2439; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.18);
  --text: #e9ecf3; --text-2: #c2c8d6; --mute: #8f98ad; --accent: #e8b931; --tint: rgba(232,185,49,.10); --tint-2: rgba(232,185,49,.18);
  --ok: #4cc38a; --ok-bg: rgba(76,195,138,.13); --warn: #f0b43c; --warn-bg: rgba(240,180,60,.13); --bad: #f2716a; --bad-bg: rgba(242,113,106,.13); --info: #86acff; --info-bg: rgba(134,172,255,.13);
  --rail: #0b101d; --rail-2: #151d31; --role-break: #59607a; --heat-0: #1b2439; --heat-1: #5c4a17; --heat-2: #a8841f; --heat-3: #e8b931; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 800; } h2 { font-size: 1.2rem; font-weight: 600; } h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .85em; }
.mute { color: var(--mute); }
.small { font-size: .82rem; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-weight: 600; }

.demobar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--gold); color: var(--on-gold); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--gold); }
.demobar b { font-family: var(--display); font-weight: 800; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
.demobar .seg { border-color: rgba(7,9,15,.35); }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-size: .82rem; font-weight: 600; color: inherit; }
.demobar .seg button[aria-pressed="true"] { background: var(--on-gold); color: var(--gold); }
.seg button[aria-pressed="true"] { background: var(--rail); color: var(--gold); }
.demobar label { display: inline-flex; gap: 6px; align-items: center; font-size: .82rem; font-weight: 600; }
.demobar .spacer { flex: 1; }
.linkbtn { border: 0; background: none; text-decoration: underline; font-weight: 600; font-size: .82rem; padding: 0; color: inherit; }

.shell { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: calc(100% - 44px); }
.shell.collapsed { grid-template-columns: 68px minmax(0,1fr); }
.rail { background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; gap: 3px; padding: 14px 10px; position: sticky; top: 44px; height: calc(100vh - 44px); overflow-y: auto; }
.rail .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; border: 0; background: none; color: inherit; text-align: left; }
.badge-2972 { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: .8rem; }
.rail .brand span { font-family: var(--display); font-weight: 600; line-height: 1.15; }
.rail .brand small { display: block; color: var(--rail-mute); font-family: var(--body); font-weight: 500; font-size: .72rem; }
.ritem { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 8px; border: 0; background: none; color: var(--rail-text); text-align: left; width: 100%; font-weight: 500; }
.ritem svg { flex: none; }
.ritem:hover { background: var(--rail-2); }
.ritem[aria-current="page"] { background: var(--rail-2); box-shadow: inset 3px 0 0 var(--gold); }
.ritem .svc { margin-left: auto; font-size: .66rem; color: var(--rail-mute); font-family: var(--mono); }
.rsect { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--rail-mute); padding: 12px 10px 4px; }
.rail .grow { flex: 1; }
.count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-size: .72rem; font-weight: 700; display: grid; place-items: center; }
.modeswitch { display: grid; grid-template-columns: 1fr 1fr; background: var(--rail-2); border-radius: 8px; padding: 3px; gap: 3px; margin: 6px 0; }
.modeswitch button { border: 0; border-radius: 6px; padding: 6px 4px; background: none; color: var(--rail-mute); font-size: .78rem; font-weight: 600; }
.modeswitch button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.collapsed .rail .label, .collapsed .rail .svc, .collapsed .rail .rsect, .collapsed .rail .brand span, .collapsed .modeswitch { display: none; }
.collapsed .rail .count { position: absolute; margin: -18px 0 0 14px; }
.collapsed .ritem { justify-content: center; position: relative; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar h1 { font-size: 1.3rem; }
.topbar .host { font-family: var(--mono); font-size: .72rem; color: var(--mute); }
.menubtn { display: none; border: 1px solid var(--line-2); background: none; border-radius: 8px; padding: 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; border-radius: 999px; padding: 5px 12px; font-weight: 600; color: var(--mute); font-size: .88rem; }
.tab[aria-pressed="true"] { background: var(--tint-2); color: var(--accent); border-color: var(--tint-2); }
.topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.content { padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; max-width: 1240px; width: 100%; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--info-bg); border-bottom: 1px solid var(--line); font-size: .88rem; }
.banner b { font-family: var(--display); }
.banner a { color: var(--info); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card.tight { gap: 8px; }
.card.hero { border-color: var(--gold); box-shadow: 0 0 0 3px var(--tint); }
.card.flat { background: var(--surface-2); border-color: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.side { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 16px; align-items: start; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; min-height: 36px; white-space: nowrap; }
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.primary:hover { background: var(--gold-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 30px; padding: 3px 10px; font-size: .84rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); } .pill.gold { background: var(--tint-2); color: var(--accent); }
.dotc { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.list { display: grid; }
.li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 160px; }
.li.click { cursor: pointer; border-radius: 6px; }
.li.click:hover { background: var(--surface-2); }
button.li { width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; padding-inline: 4px; }
.who { font-size: .76rem; color: var(--mute); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .flabel { font-size: .8rem; font-weight: 600; color: var(--text-2); }
.field input, .field select, .field textarea, .inp { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 10px; width: 100%; min-height: 36px; }
.field .guess { font-size: .74rem; color: var(--warn); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.wrap { white-space: normal; min-width: 180px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; background: var(--gold); }
.bar > i.ok { background: var(--ok); } .bar > i.info { background: var(--info); } .bar > i.soft { background: var(--heat-1); }
.hint { padding: 10px 12px; border-radius: 8px; background: var(--tint); color: var(--text-2); font-size: .86rem; }
.flowhint { border-left: 3px solid var(--gold); padding: 8px 12px; background: var(--tint); border-radius: 0 8px 8px 0; font-size: .85rem; color: var(--text-2); }
.kpi { display: grid; gap: 2px; }
.kpi b { font-family: var(--display); font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
.kpi span { font-size: .78rem; color: var(--mute); }
.empty { padding: 18px; text-align: center; color: var(--mute); border: 1px dashed var(--line-2); border-radius: 10px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.tile:hover { border-color: var(--gold); }
.tile .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--rail); color: var(--gold); display: grid; place-items: center; }
.tile b { font-family: var(--display); font-size: 1.05rem; }
.tile p { color: var(--mute); font-size: .84rem; }
.tile .ext { font-size: .7rem; color: var(--mute); font-family: var(--mono); }

/* Drawer and modal */
.drawer { position: fixed; z-index: 55; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: -20px 0 50px rgba(0,0,0,.2); overflow-y: auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)); padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; grid-auto-rows: max-content; gap: 16px; align-content: start; }
.drawer-scrim, .modal-scrim { position: fixed; inset: 0; z-index: 54; background: rgba(0,0,0,.35); border: 0; }
.modal { position: fixed; z-index: 56; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.xbtn { border: 0; background: var(--surface-2); border-radius: 8px; width: 34px; height: 34px; font-size: 1.1rem; flex: none; }

/* Check-off rows */
.checkrow { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); min-height: 64px; }
.checkrow:first-child { border-top: 0; }
.bigcheck { width: 52px; height: 52px; border-radius: 12px; border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: transparent; }
.bigcheck[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.bigcheck.sm { width: 40px; height: 40px; border-radius: 10px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 32px; height: 32px; font-weight: 700; }
.stepper span { padding: 0 10px; min-width: 64px; text-align: center; }
.chipsel { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 8px; font-size: .82rem; max-width: 170px; }

/* Location tree */
.ltree { display: grid; gap: 2px; }
.ltree button { display: flex; gap: 8px; align-items: center; border: 0; background: none; border-radius: 6px; padding: 6px 8px; text-align: left; width: 100%; }
.ltree button:hover { background: var(--surface-2); }
.ltree button[aria-pressed="true"] { background: var(--tint-2); color: var(--accent); font-weight: 600; }
.ltree .n { margin-left: auto; font-size: .74rem; color: var(--mute); }

/* Skill graph */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: .86rem; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--rail); color: var(--gold); border-color: var(--rail); }
.chip.locked { opacity: .55; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--mute); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.graphwrap { overflow: auto; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.graph { position: relative; margin: 0 auto; }
.graph svg { position: absolute; inset: 0; overflow: visible; }
.graph svg path { fill: none; stroke: var(--line-2); stroke-width: 2; }
.graph svg path.done { stroke: var(--ok); }
.gnode { position: absolute; border: 2px solid var(--line-2); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; gap: 4px; align-content: start; }
.gnode b { font-family: var(--display); font-weight: 600; font-size: .95rem; line-height: 1.2; padding-right: 18px; }
.gnode .sub { font-size: .74rem; color: var(--mute); }
.gnode .mark { position: absolute; top: 8px; right: 10px; font-weight: 700; }
.gnode .gbar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.gnode .gbar i { display: block; height: 100%; background: var(--ok); }
.gnode.complete { border-color: var(--ok); background: var(--ok-bg); }
.gnode.complete .mark { color: var(--ok); }
.gnode.available { border-color: var(--info); }
.gnode.progress { border-color: var(--warn); }
.gnode.requested { border-color: var(--info); border-style: dashed; }
.gnode.locked { opacity: .5; border-style: dashed; }
.gnode:hover:not(.locked) { box-shadow: 0 6px 18px rgba(0,0,0,.12); }

/* Month grid */
.month { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.month .dh { background: var(--surface-2); padding: 6px 8px; font-size: .72rem; font-weight: 600; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.month .day { background: var(--surface); min-height: 96px; padding: 6px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.month .day.other { background: var(--surface-2); color: var(--mute); }
.month .day.today { box-shadow: inset 0 0 0 2px var(--gold); }
.month .day .d { font-size: .78rem; font-weight: 600; }
.ev { border: 0; text-align: left; border-radius: 5px; padding: 2px 6px; font-size: .74rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface-2); width: 100%; }
.ev.k-practice { background: var(--surface-3); }
.ev.k-build { background: var(--tint-2); color: var(--accent); }
.ev.k-comp { background: var(--info-bg); color: var(--info); }
.ev.k-outreach { background: var(--ok-bg); color: var(--ok); }
.ev.k-meeting { background: rgba(155,106,214,.16); color: var(--role-lead); }
.ev.k-off { background: var(--bad-bg); color: var(--bad); }

/* Heat grid */
.heat { display: grid; gap: 3px; }
.heat .hc { height: 22px; border-radius: 4px; background: var(--heat-0); position: relative; }
.heat .hc.h1 { background: var(--heat-1); } .heat .hc.h2 { background: var(--heat-2); } .heat .hc.h3 { background: var(--heat-3); }
.heat .hc.miss { box-shadow: inset 0 0 0 2px var(--bad); }
.heat .hn { font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; display: flex; gap: 6px; align-items: center; }
.heat .hh { font-size: .64rem; color: var(--mute); text-align: center; font-family: var(--mono); }
.ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ok); flex: none; }
